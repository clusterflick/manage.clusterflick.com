on:
  workflow_dispatch:
  # `venue_health` is sent by data-analysed after each hourly health cycle, so
  # the venues page shows which sources are failing now rather than as of the
  # last release. Each rebuild cancels the one in flight (see `concurrency`),
  # and the newest always has the newest of everything.
  repository_dispatch:
    types: [release_event, venue_health]
  # A merge to main is a change to the site itself - the pages, the report
  # builders, the fetch step. Nothing else here notices that: a release
  # dispatch only fires when the data moves, so without this a change could sit
  # unpublished until the nightly run, most of a day after it was merged.
  push:
    branches: [main]
  # A nightly rebuild as well as the release trigger. Most of what this site
  # reports on doesn't move with a data-combined release: the workflow run
  # history, the LLM usage log and the venue health log all change on their own
  # schedules, and a site that only rebuilt on release would show a stale
  # pipeline page on any day the pipeline was too broken to publish one - which
  # is exactly the day you would come looking.
  schedule:
    - cron: "40 5 * * *"

name: Build and deploy website

concurrency:
  group: build-site
  cancel-in-progress: true

# Deny all by default; each job below grants only the scopes it needs.
permissions: {}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/configure-pages@v6
        with:
          static_site_generator: next
          generator_config_file: ./next.config.ts
      - run: npm ci
      # Job timings for finished runs, carried between builds so an hourly
      # rebuild looks up only the runs it hasn't seen - see TIMINGS_CACHE in
      # scripts/fetch-source-data.mjs. A fresh key every build (caches are
      # immutable) restoring from the newest earlier one.
      - uses: actions/cache@v5
        with:
          path: .cache
          key: run-timings-${{ github.run_id }}
          restore-keys: run-timings-
      - name: Fetch source data
        env:
          # Every repo this reads is public, so this is only ever about the rate
          # limit - but the limit is the whole problem. Collecting job timings
          # costs one call per run, around 600 calls a build, against 60/hour
          # unauthenticated. PAT (an org secret, as on the other sites) gives
          # 5,000/hour; GITHUB_TOKEN gives 1,000 and is the fallback so a build
          # still works before the secret is wired up. Whichever is set wins, in
          # that order - see scripts/lib/github.mjs.
          PAT: ${{ secrets.PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch-source-data
      - run: npm run build-report
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    name: Deploy site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
